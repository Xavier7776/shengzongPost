name: Daily AI Learning Publisher
on:
  # ChatGPT scheduled task owns the daily 08:30 publication; this workflow remains manual fallback.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without posting to site
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: daily-learn-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      LEARN_SITE_URL: ${{ vars.LEARN_SITE_URL }}
      LEARN_PUBLISH_SECRET: ${{ secrets.LEARN_PUBLISH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Publish verified issue (or manual dry run)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/publish-learn-daily.ts --dry-run
          else
            npx tsx scripts/publish-learn-daily.ts
          fi

name: Web Runtime Cleanup Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check backup connection and restore boundaries
        run: node --test scripts/database-backup-check.mjs
      - name: Check fixture transport boundaries
        run: npm run build:ci -- --self-test
      - name: Production build with isolated fixtures
        run: npm run build:ci
      - run: git diff --check HEAD^1 HEAD
